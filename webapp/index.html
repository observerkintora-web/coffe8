<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Кофейная рулетка</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>
<div class="bg"></div>
<canvas id="fx" class="fx-canvas"></canvas>
<div id="flash" class="flash-overlay"></div>

<main class="screen">

  <header class="head">
    <div class="brand"><span class="brand-icon">☕</span><span id="shopName">Кофейня</span></div>
  </header>

  <!-- Screen 1: pick a card — also handles the "all cards flip" moment -->
  <section id="screenPick" class="view scene-pick">
    <h1 id="pickTitle">Оберіть картку</h1>
    <p class="sub" id="pickSub">Під однією з них — ваш бонус. Кожна покупка — нова можливість.</p>
    <div class="cards-stage">
      <span class="ambient-glow" aria-hidden="true"></span>
      <span class="ambient-bean bean-1" aria-hidden="true"></span>
      <span class="ambient-bean bean-2" aria-hidden="true"></span>
      <span class="ambient-bean bean-3" aria-hidden="true"></span>
      <span class="ambient-bean bean-4" aria-hidden="true"></span>
      <span class="ambient-bean bean-5" aria-hidden="true"></span>
      <span class="ambient-bean bean-6" aria-hidden="true"></span>
      <span class="ambient-bean bean-7" aria-hidden="true"></span>
      <div class="cards" id="cards"></div>
    </div>
    <p class="footnote" id="footnotePick">Приз активується завтра і діє кілька днів</p>
  </section>

  <section id="screenReveal" class="view scene-prize" hidden>
    <p class="congrats-eyebrow">Вітаємо! Ви виграли</p>
    <span class="tier-badge" id="tierBadge">COMMON</span>
    <div class="reveal-icon" id="revealIconWrap">
      <span class="rays"></span>
      <img id="revealIcon" src="" alt="" />
    </div>
    <div class="scene-beans reveal-beans" aria-hidden="true">
      <span class="ambient-bean bean-1"></span><span class="ambient-bean bean-2"></span>
      <span class="ambient-bean bean-3"></span><span class="ambient-bean bean-4"></span>
    </div>
    <h2 id="revealLabel"></h2>
    <div class="info-box" id="validityBox"></div>
    <button id="nextBtn" class="primary-btn" type="button">Чудово! <span>›</span></button>
  </section>

  <section id="screenGallery" class="view scene-gallery" hidden>
    <p class="gallery-title">Ось які призи ще можна виграти</p>
    <p class="gallery-sub">Спробуй ще раз наступного разу!</p>
    <div class="gallery-cards" id="galleryCards"></div>
    <div class="gallery-dots" id="galleryDots" aria-label="Слайди призів"></div>
    <button id="closeBtn" class="primary-btn" type="button">Спробуй ще раз наступного разу ☕</button>
    <p class="gallery-note">Більше, ніж просто кава ♡</p>
  </section>

  <footer class="brand-footer">
    <span id="shopNameFooter">Кофейня</span>
    <span class="tagline">Смакуй більше моментів</span>
  </footer>
</main>

<script src="script.js"></script>
</body>
</html>
